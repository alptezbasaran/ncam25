<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fullscreen Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    .bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('../assets/black_hole.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }
    .content-box {
      position: fixed;
      right: 3vw;
      top: 3vh;
      transform: none;
      background: transparent;
      color: #fff;
      padding: 0;
      border-radius: 0;
      max-width: 40vw;
      box-shadow: none;
      z-index: 2;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      text-align: right;
    }
    .content-box h2 {
      margin: 0 0 6px 0;
      font-size: clamp(24px, 4vw, 48px);
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .content-box p {
      margin: 0;
      font-size: clamp(14px, 1.8vw, 22px);
      line-height: 1.3;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .content-box .small {
      font-size: clamp(14px, 1.8vw, 24px);
      letter-spacing: 0.02em;
      font-weight: 600;
    }
    .content-box .big {
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.05;
    }
  </style>
  <script>
    // Resize handler to ensure consistent viewport coverage on iOS Safari and others
    function setSize() {
      document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
    }
    window.addEventListener('resize', setSize);
    window.addEventListener('orientationchange', setSize);
    setSize();
  </script>
</head>
<body>
  <div class="bg" role="img" aria-label="Black hole background"></div>
  <div class="content-box">
    <p class="small">We are looking for</p>
    <p class="big">INTERMEDIATE MASS</p>
    <p class="big">BLACK HOLES</p>
  </div>
</body>
</html>
